name: Build Blender Addon
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create zip
        run: |
          cd BUMLi
          zip -r ../BUMLi.zip .
      - uses: softprops/action-gh-release@v1
        with:
          files: BUMLi.zip
